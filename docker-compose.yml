services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_APP_URL=https://andreea-gmuastudio.com
        - NEXT_PUBLIC_BASE_URL_API=https://andreea-gmuastudio.com
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://beautydb_admin:${MONGO_ROOT_PASSWORD}@mongo:27017/beauty?authSource=admin
      - CORS_ORIGIN=https://andreea-gmuastudio.com,https://www.andreea-gmuastudio.com
      - NEXT_PUBLIC_APP_URL=https://andreea-gmuastudio.com
      - NEXT_PUBLIC_BASE_URL_API=https://andreea-gmuastudio.com
      - NEXTAUTH_URL=https://andreea-gmuastudio.com
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - WHATSAPP_ENABLED=false
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./public/uploads:/app/public/uploads
      - wwebjs_auth:/app/.wwebjs_auth
      - logs:/app/logs
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'

  mongo:
    image: mongo:7
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=beautydb_admin
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "beautydb_admin", "--password", "${MONGO_ROOT_PASSWORD}", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongo_data:
  wwebjs_auth:
  logs:
