services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/beauty
      - CORS_ORIGIN=https://tuodominio.com
      - NEXT_PUBLIC_APP_URL=https://tuodominio.com
      - NEXT_PUBLIC_BASE_URL_API=https://tuodominio.com
      - NEXTAUTH_URL=https://tuodominio.com
      - HOSTNAME=0.0.0.0
      - PORT=3000
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - wwebjs_auth:/app/.wwebjs_auth
      - logs:/app/logs
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'

  mongo:
    image: mongo:7
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongo_data:
  uploads:
  wwebjs_auth:
  logs:
